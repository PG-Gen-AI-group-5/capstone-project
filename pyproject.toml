[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swing-intel"
version = "0.1.0"
description = "Agentic swing-trade intelligence for NSE stocks"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=1.0",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "yfinance>=0.2.40",
    "exchange_calendars>=4.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
models = ["torch>=2.2", "statsmodels>=0.14", "scipy>=1.11", "joblib>=1.3"]
notebooks = ["jupyterlab>=4", "matplotlib>=3.8", "ipykernel>=6.29", "nbconvert>=7.16", "nbformat>=5.10", "statsmodels>=0.14", "scipy>=1.11"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
