# Project settings. Secrets (API keys) go in .env, not here.

paths:
  data: data                       # relative to the project root

# Which stocks each part of the system uses (tiers come from data/manual/universe.csv)
universe:
  agents: nifty50                  # announcements, PDFs, news, evaluation
  prices: nifty50                  # set to nifty200 to also collect Nifty 200 prices for training

# First date collected for each source
start_dates:
  prices: 2016-01-01
  results: 2015-01-01
  corporate_actions: 2016-01-01
  announcements: 2016-01-01
  insider: 2016-01-01
  pdfs: 2022-10-01                 # full text only for the agent window (validation + test + lookback)
  gdelt: 2022-10-01
  fred: 2016-01-01

# Minimum seconds between requests, per host
rate_limits:
  www.nseindia.com: 1.0
  nsearchives.nseindia.com: 1.0
  data.gdeltproject.org: 0.2
  api.stlouisfed.org: 0.5
  default: 1.0

http:
  timeout: 30
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"

prices:
  publish_time_ist: "18:00"        # bhavcopy appears after the close; usable from the next forecast

fii_dii:
  publish_time_ist: "20:00"        # provisional figures are posted in the evening

announcements:
  # An announcement is important if its category contains one of these (case-insensitive)
  important_categories:
    - financial result
    - outcome of board meeting
    - press release
    - acquisition
    - amalgamation
    - merger
    - credit rating
    - change in director
    - change in management
    - change in key managerial
    - resignation
    - appointment
    - award of order
    - receipt of order
    - bagging
    - takeover
    - pledge
    - buyback
    - scheme of arrangement
    - restructuring
    - fraud
    - default
    - action(s) taken or orders passed
  # For generic categories ("Updates", "General Updates"), important if the summary contains one of these words
  generic_categories: [updates, general updates]
  important_keywords:
    - order
    - contract
    - acquisition
    - acquire
    - merger
    - rating
    - resign
    - appoint
    - fire
    - plant
    - usfda
    - penalty
    - fine
    - litigation
    - investigation
    - search
    - raid
    - strike
    - shutdown
    - guidance
    - results
    - launch
    - expansion
    - capex
    - stake

pdfs:
  scanned_chars_per_page: 100      # less text than this per page = probably a scanned image

fred:
  # The five series are market prices: the value for day d is known at that day's close,
  # so it is usable from the next day. FRED publishes three of them only weekly; that matters
  # for the live daily job (latest days missing on FRED), not for the backtest.
  series:
    DGS10: {lag_days: 1, published: daily, description: US 10-year Treasury yield}
    VIXCLS: {lag_days: 1, published: daily, description: US VIX}
    DEXINUS: {lag_days: 1, published: weekly, description: USD/INR}
    DTWEXBGS: {lag_days: 1, published: weekly, description: Broad dollar index}
    DCOILBRENTEU: {lag_days: 1, published: weekly, description: Brent crude}

gdelt:
  keep_zip: false                  # raw 15-minute files are deleted after filtering (re-downloadable)
  masterlist_max_age_hours: 24

tracker:
  max_attempts: 3
  retry_base_sec: 300              # retry after 5 min, then 10, then 20

# ---------------------------------------------------------------- modelling

# Inclusive date ranges. Test-period results come only from the freeze tasks (16.9, 18.4).
periods:
  train: [2016-01-01, 2022-12-31]
  validation: [2023-01-01, 2023-12-31]
  test: [2024-01-01, null]         # null = latest data
  # Walk-forward folds inside the training years: a second check beside the calm 2023 validation
  # year (EDA 02 §10). 2020 has the COVID crash, 2022 a falling market.
  inner: [2020-01-01, 2022-12-31]

forecast_time_ist: "08:30"         # forecast for trading day d is made at 08:30 IST; entry at the 09:15 open

labels:
  horizons: [1, 5, 10]             # trading days; the trade-plan range is 3-10
  # open: log return from the open of day d to the close of day d+h-1 (matches the trade entry)
  # close: log return from the close of day d-1 to the close of day d+h-1 (time-series convention)
  entry: open
  # Volatility label: root mean square of daily close-to-close log returns over days d..d+h-1

adjustment:
  demerger_min_move: 0.01          # a scheme/demerger whose ex-date open moves less than this is treated as factor 1
  jump_threshold: 0.20             # adjusted daily moves above this are listed in the jump report

features:
  min_history: 200                 # trading days a stock needs before its rows are used (EMA 200)
  # Short special sessions left out of model inputs and labels (stocks and index). Diwali Muhurat
  # trading is about an hour in the evening, with no 09:15 open to enter at. Matched against the
  # note column of data/manual/calendar_overrides.csv.
  skip_sessions: [Muhurat]
  beta_window: 60                  # trading days for the rolling beta to the Nifty 50
  events:
    # A results release is the earliest of: financial_results.broadcast_at, an announcement in one of
    # these categories, or an "Outcome of Board Meeting" announcement that mentions results
    # (EDA 03 §4: the broadcast time is often a day or more late; open item 26).
    results_categories: ["Financial Result Updates", "Financial Results Updates"]
    results_merge_days: 25         # records within this many trading days of a release join it (late refilings);
                                   # real releases are 27+ trading days apart (Q4 by 30 May, Q1 from 9 Jul)
    days_since_cap: 90             # trading days; also the value before a stock's first release
  # Monthly F&O expiry weekday (0 = Monday) from each start date: the last such weekday of the month,
  # or the trading day before it when it is a holiday. NSE moved monthly expiries to Tuesday in Sep 2025.
  expiry_weekday: {"2016-01-01": 3, "2025-09-01": 1}

models:
  seed: 42
  n_jobs: -1                       # parallel workers for per-stock models (ARIMA); -1 = all cores
  refit:                           # how often walk-forward refits: monthly | quarterly | yearly
    base_rate: yearly
    ma_crossover: yearly
    hist_vol: yearly
    arima: monthly
    lstm: yearly
    tft: yearly
  arima:
    max_p: 2
    max_q: 2
  sequence:                        # shared by LSTM and TFT
    window: 60                     # trading days of history per sample
    batch_size: 512
    max_epochs: 20
    patience: 3                    # early stopping on the last part of the training window
    early_stop_days: 120           # trading days at the end of the training window held out for early stopping
    samples_per_epoch: 0           # random training samples per epoch; 0 = all
    lr: 0.001
    weight_decay: 0.0001
    threads: 0                     # torch CPU threads; 0 = all cores
  lstm:
    hidden: 64
    layers: 2
    dropout: 0.2
    symbol_dim: 8
    sector_dim: 4
  tft:
    hidden: 32
    heads: 4
    dropout: 0.1
    quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
    sequence:                      # overrides of `sequence` for the TFT: ~2.5 s per batch of 512 on a 12-core CPU
      window: 30
      samples_per_epoch: 30000
      max_epochs: 15

# LLM layer (src/llm). provider: offline = each agent's rule-based stand-in, no API key needed;
# openai_compatible = any OpenAI-style Chat Completions endpoint, set by JFF_LLM_* variables in .env;
# anthropic = Claude through the official SDK (ANTHROPIC_API_KEY in .env). The choice and the model's
# training cutoff are task 1.10; agent results are scored only on dates after the cutoff.
llm:
  provider: openai_compatible
  model: claude-opus-5-5           # for provider anthropic; openai_compatible uses JFF_LLM_MODEL from .env
  openai_compatible:               # names of the .env variables (never the values) and request options
    base_url_env: JFF_LLM_BASE_URL
    api_key_env: JFF_LLM_API_KEY
    model_env: JFF_LLM_MODEL
    timeout_env: JFF_LLM_TIMEOUT
    temperature: 0.0
    json_mode: false               # send response_format json_object; only for endpoints that support it
    price_per_mtok: {input: 0.0, output: 0.0}   # set if the endpoint charges, so the daily budget applies
  training_cutoff: null            # set with the model (task 1.10)
  effort: medium                   # low | medium | high | xhigh | max
  max_tokens: 16000
  timeout_sec: 120
  max_retries: 2
  daily_budget_usd: 5.0            # paid calls stop for the day once spent; the offline rules take over
  daily_call_limit: 500            # LLM calls per day (all agents); the offline rules take over after it
  price_per_mtok: {input: 4.0, output: 20.0, cache_read: 0.20, cache_write: 5.0}
  prompt_versions: {}              # pin an agent's prompt, e.g. {critic: v1}; default: the latest file

agents:
  base_model: tft                  # the trained model whose forecast the agents see (task 12.6)
  max_stocks_per_day: 5            # Planner: full analyses per day
  min_planner_score: 2             # setup = 2, results/announcement/base forecast = 1 each
  evidence_lookback_days: 30
  min_edge: 0.05                   # Forecaster: bull - bear + (p_up - 0.5) needed for a long
  min_risk_reward: 1.5             # Critic and Forecaster
  max_confidence: 0.75             # Critic: until calibration (task 15.2)
  critic_max_rounds: 2             # revise loops before the last verdict stands
  high_vix: 0.20                   # India VIX level (as a fraction) the Bear calls high
  hold_days: {pullback_uptrend: 7, breakout: 10, oversold_bounce: 5, none: 5}

# Swing setups and trade levels (src/features/setups.py, tasks 10.3-10.4); RSI is on a 0-1 scale.
setups:
  stop_atr: 1.5                    # stop = close x (1 - 1.5 ATR%)
  reward_risk: 2.0                 # target = close x (1 + 2 x 1.5 ATR%)
  pullback: {ema20_gap_min: -0.02, ema20_gap_max: 0.01, rsi_min: 0.40, rsi_max: 0.60}
  breakout: {dist_52w_high_min: -0.01, logvol_z_min: 0.5}
  oversold: {rsi_max: 0.30}

# Indian equity delivery costs per order (src/backtest/costs.py, task 17.2). Check against a broker calculator.
costs:
  brokerage_pct: 0.0
  brokerage_max: 20.0
  stt_pct: 0.001
  exchange_pct: 0.0000297
  sebi_per_crore: 10.0
  stamp_buy_pct: 0.00015
  gst_pct: 0.18
  dp_per_sell: 15.93

backtest:
  models: [ma_crossover, arima, lstm, tft]     # forecasts turned into signals (task 16.8)
  horizon: 5                                   # p_up horizon and holding period for model signals
  default_threshold: 0.55                      # long when p_up >= threshold; tune per model on validation
  thresholds: {}
  agent_runs: []                               # agent run IDs to backtest beside the models
  portfolio: {capital: 1000000, risk_per_trade: 0.01, max_positions: 5, max_position_pct: 0.2}

# Paper-trading desk and its app (src/desk, src/api, frontend/). A desk replays history day by day: the agents
# plan each morning, the backtest engine fills the plans in the session. Run: python -m src.api
desk:
  db: app/desk.sqlite              # under data/, so it stays out of git
  periods: [inner, validation]     # days a desk may replay: where walk-forward forecasts exist. Never `test` (18.4).
  capital: 1000000
  history_days: 400                # feature history loaded before the window (charts, the Exit Monitor)
  vol_model: lstm                  # whose volatility forecast draws the chart's range (the robust model, EDA 03)

# Live suggester (src/live, src/desk/live.py): each trading day, suggestions for the next session and exit advice on
# the trades you report. Live tables and models live in data/live/ (never data/derived or the frozen test forecasts).
# Run: python -m src.live daily   |   schedule: python -m src.live schedule install
live:
  models: [tft, lstm]              # refitted on all data to the day before; the TFT is the agents' base forecast,
                                   # the LSTM draws the volatility range
  refit_every_days: 5              # trading days between refits (the weekly task refits; the 08:00 run only predicts)
  daily_time: "08:00"              # IST, weekdays: after the previous evening's bhavcopy and overnight filings
  refit_day: SAT
  refit_time: "10:00"
  weekly_sources_every_days: 7     # corporate actions, results and FRED are re-read weekly
  stale_ok: false                  # refuse to suggest for a day that has already passed (data not updated)

# Market regime labels (src/features/regime.py). Each label for day d uses closes up to d-1.
regime:
  trend_ema_span: 200              # Nifty 50 close vs its 200-day EMA
  vix_band_period: [2016-01-01, 2022-12-31]   # VIX cut-points fitted on train only
  vix_quantiles: [0.3333333, 0.6666667]       # terciles
  vix_labels: [low, mid, high]
