# Project settings. Secrets (API keys) go in .env, not here.

paths:
  data: data                       # relative to the project root

# Which stocks each part of the system uses (tiers come from data/manual/universe.csv)
universe:
  agents: nifty50                  # announcements, PDFs, news, evaluation
  prices: nifty50                  # set to nifty200 to also collect Nifty 200 prices for training

# First date collected for each source
start_dates:
  prices: 2016-01-01
  results: 2015-01-01
  corporate_actions: 2016-01-01
  announcements: 2016-01-01
  insider: 2016-01-01
  pdfs: 2022-10-01                 # full text only for the agent window (validation + test + lookback)
  gdelt: 2022-10-01
  fred: 2016-01-01

# Minimum seconds between requests, per host
rate_limits:
  www.nseindia.com: 1.0
  nsearchives.nseindia.com: 1.0
  data.gdeltproject.org: 0.2
  api.stlouisfed.org: 0.5
  default: 1.0

http:
  timeout: 30
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"

prices:
  publish_time_ist: "18:00"        # bhavcopy appears after the close; usable from the next forecast

fii_dii:
  publish_time_ist: "20:00"        # provisional figures are posted in the evening

announcements:
  # An announcement is important if its category contains one of these (case-insensitive)
  important_categories:
    - financial result
    - outcome of board meeting
    - press release
    - acquisition
    - amalgamation
    - merger
    - credit rating
    - change in director
    - change in management
    - change in key managerial
    - resignation
    - appointment
    - award of order
    - receipt of order
    - bagging
    - takeover
    - pledge
    - buyback
    - scheme of arrangement
    - restructuring
    - fraud
    - default
    - action(s) taken or orders passed
  # For generic categories ("Updates", "General Updates"), important if the summary contains one of these words
  generic_categories: [updates, general updates]
  important_keywords:
    - order
    - contract
    - acquisition
    - acquire
    - merger
    - rating
    - resign
    - appoint
    - fire
    - plant
    - usfda
    - penalty
    - fine
    - litigation
    - investigation
    - search
    - raid
    - strike
    - shutdown
    - guidance
    - results
    - launch
    - expansion
    - capex
    - stake

pdfs:
  scanned_chars_per_page: 100      # less text than this per page = probably a scanned image

fred:
  # The five series are market prices: the value for day d is known at that day's close,
  # so it is usable from the next day. FRED publishes three of them only weekly; that matters
  # for the live daily job (latest days missing on FRED), not for the backtest.
  series:
    DGS10: {lag_days: 1, published: daily, description: US 10-year Treasury yield}
    VIXCLS: {lag_days: 1, published: daily, description: US VIX}
    DEXINUS: {lag_days: 1, published: weekly, description: USD/INR}
    DTWEXBGS: {lag_days: 1, published: weekly, description: Broad dollar index}
    DCOILBRENTEU: {lag_days: 1, published: weekly, description: Brent crude}

gdelt:
  keep_zip: false                  # raw 15-minute files are deleted after filtering (re-downloadable)
  masterlist_max_age_hours: 24

tracker:
  max_attempts: 3
  retry_base_sec: 300              # retry after 5 min, then 10, then 20

# ---------------------------------------------------------------- modelling

# Inclusive date ranges. Test-period results come only from the freeze tasks (16.9, 18.4).
periods:
  train: [2016-01-01, 2022-12-31]
  validation: [2023-01-01, 2023-12-31]
  test: [2024-01-01, null]         # null = latest data
  # Walk-forward folds inside the training years: a second check beside the calm 2023 validation
  # year (EDA 02 §10). 2020 has the COVID crash, 2022 a falling market.
  inner: [2020-01-01, 2022-12-31]

forecast_time_ist: "08:30"         # forecast for trading day d is made at 08:30 IST; entry at the 09:15 open

labels:
  horizons: [1, 5, 10]             # trading days; the trade-plan range is 3-10
  # open: log return from the open of day d to the close of day d+h-1 (matches the trade entry)
  # close: log return from the close of day d-1 to the close of day d+h-1 (time-series convention)
  entry: open
  # Volatility label: root mean square of daily close-to-close log returns over days d..d+h-1

adjustment:
  demerger_min_move: 0.01          # a scheme/demerger whose ex-date open moves less than this is treated as factor 1
  jump_threshold: 0.20             # adjusted daily moves above this are listed in the jump report

features:
  min_history: 200                 # trading days a stock needs before its rows are used (EMA 200)
  # Short special sessions left out of model inputs and labels (stocks and index). Diwali Muhurat
  # trading is about an hour in the evening, with no 09:15 open to enter at. Matched against the
  # note column of data/manual/calendar_overrides.csv.
  skip_sessions: [Muhurat]
  beta_window: 60                  # trading days for the rolling beta to the Nifty 50
  events:
    # A results release is the earliest of: financial_results.broadcast_at, an announcement in one of
    # these categories, or an "Outcome of Board Meeting" announcement that mentions results
    # (EDA 03 §4: the broadcast time is often a day or more late; open item 26).
    results_categories: ["Financial Result Updates", "Financial Results Updates"]
    results_merge_days: 25         # records within this many trading days of a release join it (late refilings);
                                   # real releases are 27+ trading days apart (Q4 by 30 May, Q1 from 9 Jul)
    days_since_cap: 90             # trading days; also the value before a stock's first release
  # Monthly F&O expiry weekday (0 = Monday) from each start date: the last such weekday of the month,
  # or the trading day before it when it is a holiday. NSE moved monthly expiries to Tuesday in Sep 2025.
  expiry_weekday: {"2016-01-01": 3, "2025-09-01": 1}

models:
  seed: 42
  n_jobs: -1                       # parallel workers for per-stock models (ARIMA); -1 = all cores
  refit:                           # how often walk-forward refits: monthly | quarterly | yearly
    base_rate: yearly
    ma_crossover: yearly
    hist_vol: yearly
    arima: monthly
    lstm: yearly
    tft: yearly
  arima:
    max_p: 2
    max_q: 2
  sequence:                        # shared by LSTM and TFT
    window: 60                     # trading days of history per sample
    batch_size: 512
    max_epochs: 20
    patience: 3                    # early stopping on the last part of the training window
    early_stop_days: 120           # trading days at the end of the training window held out for early stopping
    samples_per_epoch: 0           # random training samples per epoch; 0 = all
    lr: 0.001
    weight_decay: 0.0001
    threads: 0                     # torch CPU threads; 0 = all cores
  lstm:
    hidden: 64
    layers: 2
    dropout: 0.2
    symbol_dim: 8
    sector_dim: 4
  tft:
    hidden: 32
    heads: 4
    dropout: 0.1
    quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
    sequence:                      # overrides of `sequence` for the TFT: ~2.5 s per batch of 512 on a 12-core CPU
      window: 30
      samples_per_epoch: 30000
      max_epochs: 15

# Market regime labels (src/features/regime.py). Each label for day d uses closes up to d-1.
regime:
  trend_ema_span: 200              # Nifty 50 close vs its 200-day EMA
  vix_band_period: [2016-01-01, 2022-12-31]   # VIX cut-points fitted on train only
  vix_quantiles: [0.3333333, 0.6666667]       # terciles
  vix_labels: [low, mid, high]
